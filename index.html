// ============================================================
// FIREBASE-KONFIGURATION
// Gleiche Datenbank wie das Ryder-Cup-Tool, eigener Datenpfad.
// ============================================================
const FIREBASE_URL = "https://ryder-cup-landshut-default-rtdb.europe-west1.firebasedatabase.app";
const BASE = "liveScoring";

async function fbFetch(path, options) {
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), 8000);
  try {
    return await fetch(`${FIREBASE_URL}/${BASE}/${path}.json`, { ...options, signal: controller.signal });
  } finally {
    clearTimeout(timer);
  }
}
async function fbGet(path) {
  const res = await fbFetch(path);
  if (!res.ok) throw new Error('Firebase GET fehlgeschlagen: ' + res.status);
  return res.json();
}
async function fbPut(path, value) {
  const res = await fbFetch(path, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(value) });
  if (!res.ok) throw new Error('Firebase PUT fehlgeschlagen: ' + res.status);
}
async function fbPatch(path, value) {
  const res = await fbFetch(path, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(value) });
  if (!res.ok) throw new Error('Firebase PATCH fehlgeschlagen: ' + res.status);
}

// Alle vier Tees teilen sich dieselbe Par-/Index-Karte, nur der CR-Wert unterscheidet sich
// (die daraus resultierende Vorgabe kommt bereits fertig aus der Startliste pro Spieler).
const TEES = [
  { id: 'Weiß', cr: '72.8' },
  { id: 'Gelb', cr: '71.1' },
  { id: 'Blau', cr: '74.5' },
  { id: 'Rot', cr: '72.4' },
];
const TEE_IDS = TEES.map(t => t.id);

const DEFAULT_PARS_18 = [4,4,5,5,4,3,5,3,4, 4,4,5,4,3,5,3,4,4]; // GC Landshut
const DEFAULT_SI_18   = [9,5,11,7,15,3,13,1,17, 8,14,18,12,10,16,6,4,2]; // GC Landshut
const DEFAULT_PARS_9 = DEFAULT_PARS_18.slice(0,9);
const DEFAULT_SI_9 = [5,3,7,4,9,1,8,6,2]; // Behelfswerte für 9-Loch, bis echte 9-Loch-Karte vorliegt
// Platzkarte ist fest und identisch für alle Turniere (ändert sich nicht) – keine Eingabe nötig.
function courseFor(holes) {
  return holes === 18 ? { pars: DEFAULT_PARS_18, si: DEFAULT_SI_18 } : { pars: DEFAULT_PARS_9, si: DEFAULT_SI_9 };
}

// Bei fester Klassifizierung (Clubmeisterschaft/Masters) kann jede Klasse eine eigene Teilmenge der
// Turnier-Runden spielen (z. B. Herren 3, Damen 2) und einen eigenen Abschlag nutzen.
function classRoundIdsFor(m, cls) {
  const cfg = m.classConfig && m.classConfig[cls];
  if (cfg && cfg.rounds && cfg.rounds.length) return cfg.rounds;
  return (m.rounds || []).map(r => r.id); // Fallback: alle Runden (ältere Turniere ohne classConfig)
}
function classRoundsFor(m, cls) {
  const ids = classRoundIdsFor(m, cls);
  return (m.rounds || []).filter(r => ids.includes(r.id));
}

function newId() { return Math.random().toString(36).slice(2, 9); }
function genToken() { return Math.random().toString(36).slice(2, 10); }
function genPassword() { return Math.floor(1000 + Math.random() * 9000).toString(); }

// Schläge, die ein Spieler an einem Loch bekommt (oder bei Plus-Handicap abgeben muss).
// Positive Vorgabe: Schläge werden ab dem schwersten Loch (niedrigster Stroke Index) vergeben.
// Negative Vorgabe (Plus-Spieler): Schläge werden ab dem leichtesten Loch (höchster Stroke Index)
// abgezogen – das entspricht der offiziellen WHS-Regel für Plus-Handicaps.
function strokesOnHole(hcp, si, holesCount) {
  const rounded = Math.round(hcp);
  if (rounded >= 0) {
    const base = Math.floor(rounded / holesCount);
    const remainder = rounded - base * holesCount;
    return base + (si <= remainder ? 1 : 0);
  } else {
    const a = -rounded;
    const base = Math.floor(a / holesCount);
    const remainder = a - base * holesCount;
    const extra = si > (holesCount - remainder) ? 1 : 0;
    return -(base + extra);
  }
}

function isEntered(v) { return v !== null && v !== undefined && v !== ''; }
function isNumericScore(v) { return isEntered(v) && v !== STRICH; }

function grossTotal(scores) {
  const vals = Object.values(scores || {}).filter(isNumericScore);
  return vals.reduce((a, b) => a + Number(b), 0);
}
function holesPlayed(scores) {
  return Object.values(scores || {}).filter(isEntered).length;
}
function hasStrich(scores) {
  return Object.values(scores || {}).some(v => v === STRICH);
}

// Klassische Stableford-Skala: Par = 2 Punkte, je Schlag besser/schlechter +/-1, min. 0.
function stablefordPoints(diff) {
  if (diff === null || diff === undefined) return 0; // Strich = 0 Punkte
  return Math.max(0, 2 - diff);
}

// Zeigt den Nachnamen zuerst an (nimmt an, dass das letzte Wort der Nachname ist) – rein
// für die Anzeige in der Live-Rangliste, die gespeicherten Namen bleiben unverändert.
function lastNameFirst(fullName) {
  if (!fullName) return fullName;
  const parts = fullName.trim().split(/\s+/);
  if (parts.length < 2) return fullName;
  const last = parts[parts.length - 1];
  const first = parts.slice(0, -1).join(' ');
  return `${last} ${first}`;
}

function playerHcpClass(hcp, hcpClasses) {
  for (const c of hcpClasses) {
    const from = c.from === '' || c.from === undefined ? -999 : Number(c.from);
    const to = c.to === '' || c.to === undefined ? 999 : Number(c.to);
    if (hcp >= from && hcp <= to) return c.id;
  }
  return null;
}

// ============================================================
// APP
// ============================================================
function App() {
  const [phase, setPhase] = useState('loading'); // loading | display | adminGate | admin | soloGate | solo
  const [tournament, setTournament] = useState(null);
  const [err, setErr] = useState('');
  const [soloFlightId, setSoloFlightId] = useState(null);

  const load = useCallback(async () => {
    try {
      const t = await fbGet('tournament');
      setTournament(t);
      return t;
    } catch (e) {
      setErr('Verbindung zur Datenbank fehlgeschlagen.');
      return null;
    }
  }, []);

  useEffect(() => {
    (async () => {
      const t = await load();
      const params = new URLSearchParams(window.location.search);
      const token = params.get('m');
      if (params.get('admin') === '1') {
        setPhase('adminGate');
        return;
      }
      if (token) {
        const flightId = Object.keys((t && t.flights) || {}).find(id => t.flights[id].token === token);
        if (flightId) {
          setSoloFlightId(flightId);
          const savedAuth = localStorage.getItem('ls_auth_' + flightId);
          setPhase(savedAuth === '1' ? 'solo' : 'soloGate');
          return;
        }
      }
      setPhase('display');
    })();
  }, [load]);

  useEffect(() => {
    if (phase === 'loading') return;
    const iv = setInterval(load, 6000);
    return () => clearInterval(iv);
  }, [phase, load]);

  if (phase === 'loading') {
    return <div style={{ minHeight: '100vh', display: 'flex', alignItems: 'center', justifyContent: 'center', color: C.muted }}>Lädt…</div>;
  }

  if (phase === 'adminGate') {
    return <AdminGate tournament={tournament} onAuthed={() => setPhase('admin')} onBack={() => { window.history.replaceState({}, '', window.location.pathname); setPhase('display'); }} />;
  }
  if (phase === 'admin') {
    return <AdminDashboard tournament={tournament} reload={load} />;
  }
  if (phase === 'soloGate') {
    return <SoloGate tournament={tournament} flightId={soloFlightId} onAuthed={() => setPhase('solo')} />;
  }
  if (phase === 'solo') {
    return <SoloEntry tournament={tournament} flightId={soloFlightId} reload={load} />;
  }
  return <PublicLeaderboard tournament={tournament} err={err} />;
}

// ADMIN GATE
// ============================================================
function AdminGate({ tournament, onAuthed, onBack }) {
  const [pin, setPin] = useState('');
  const [error, setError] = useState('');
  const pinSet = tournament && tournament.meta && tournament.meta.adminPin;

  const submit = async () => {
    if (!pinSet) { onAuthed(); return; }
    if (pin === tournament.meta.adminPin) { onAuthed(); }
    else setError('Falsche PIN.');
  };

  return (
    <div className="wrap" style={{ maxWidth: 340, paddingTop: '20vh' }}>
      <div style={{ background: C.card, border: `1px solid ${C.line}`, borderRadius: 12, padding: 24 }}>
        <div style={{ fontSize: 18, fontWeight: 600, color: C.ink, marginBottom: 4 }}>Admin-Zugang</div>
        <div style={{ fontSize: 13, color: C.muted, marginBottom: 16 }}>GC Landshut Live-Scoring</div>
        <input type="password" placeholder="PIN" value={pin} onChange={e => setPin(e.target.value)}
          style={{ width: '100%', padding: '10px 12px', border: `1px solid ${C.line}`, borderRadius: 6, fontSize: 15, marginBottom: 10 }} />
        {error && <div style={{ color: C.red, fontSize: 13, marginBottom: 10 }}>{error}</div>}
        <button onClick={submit} style={{ width: '100%', padding: '11px 0', background: C.ink, color: '#fff', border: 'none', borderRadius: 6, fontSize: 14, fontWeight: 600, cursor: 'pointer' }}>Anmelden</button>
        <button onClick={onBack} style={{ width: '100%', padding: '9px 0', background: 'none', border: 'none', color: C.muted, fontSize: 13, marginTop: 8, cursor: 'pointer' }}>Zurück zur Rangliste</button>
      </div>
    </div>
  );
}

// ============================================================
// SOLO GATE (Flight-Link, Passwort)
// ============================================================
function SoloGate({ tournament, flightId, onAuthed }) {
  const [pw, setPw] = useState('');
  const [error, setError] = useState('');
  const flight = tournament && tournament.flights && tournament.flights[flightId];
  if (!flight) return <div className="wrap">Flight nicht gefunden.</div>;

  const submit = () => {
    if (pw === flight.password) {
      localStorage.setItem('ls_auth_' + flightId, '1');
      onAuthed();
    } else setError('Falsches Passwort.');
  };

  return (
    <div className="wrap" style={{ maxWidth: 340, paddingTop: '20vh' }}>
      <div style={{ background: C.card, border: `1px solid ${C.line}`, borderRadius: 12, padding: 24 }}>
        <div style={{ fontSize: 18, fontWeight: 600, color: C.ink, marginBottom: 4 }}>{flight.name}</div>
        <div style={{ fontSize: 13, color: C.muted, marginBottom: 16 }}>Bitte Passwort eingeben, um Scores einzutragen.</div>
        <input type="password" placeholder="Passwort" value={pw} onChange={e => setPw(e.target.value)}
          style={{ width: '100%', padding: '10px 12px', border: `1px solid ${C.line}`, borderRadius: 6, fontSize: 15, marginBottom: 10 }} />
        {error && <div style={{ color: C.red, fontSize: 13, marginBottom: 10 }}>{error}</div>}
        <button onClick={submit} style={{ width: '100%', padding: '11px 0', background: C.ink, color: '#fff', border: 'none', borderRadius: 6, fontSize: 14, fontWeight: 600, cursor: 'pointer' }}>Bestätigen</button>
      </div>
    </div>
  );
}

function TournamentSetup({ tournament, reload }) {
  const m = (tournament && tournament.meta) || {};
  const [name, setName] = useState(m.name || '');
  const [type, setType] = useState(m.type || 'clubmeisterschaft');
  const [holes, setHoles] = useState(m.holes || 18);
  const [classificationMode, setClassificationMode] = useState(m.classificationMode || (type === 'clubmeisterschaft' ? 'fixed' : 'hcp'));
  const [hcpClasses, setHcpClasses] = useState(m.hcpClasses || [{ id: 'A', from: 0, to: 8, prizeCount: 3 }, { id: 'B', from: 8.1, to: 16, prizeCount: 3 }]);
  const [rounds, setRounds] = useState(m.rounds || [{ id: 1, label: 'Runde 1' }, { id: 2, label: 'Runde 2' }]);
  const [scoringMode, setScoringMode] = useState(m.scoringMode || ((m.type || 'clubmeisterschaft') === 'clubmeisterschaft' || (m.type || '') === 'masters' ? 'strokeplay_net' : 'stableford'));
  const [adminPin, setAdminPin] = useState(m.adminPin || '2026');
  const [herrenTee, setHerrenTee] = useState(m.herrenTee || 'Weiß');
  const [damenTee, setDamenTee] = useState(m.damenTee || 'Blau');
  const [bruttoSplit, setBruttoSplit] = useState(!!(m.bruttoClasses && m.bruttoClasses.length === 2));
  const [bruttoPrizeCombined, setBruttoPrizeCombined] = useState((m.bruttoClasses && m.bruttoClasses.length === 1 && m.bruttoClasses[0].prizeCount) || m.prizeCount || 3);
  const [bruttoPrizeHerren, setBruttoPrizeHerren] = useState((m.bruttoClasses && m.bruttoClasses.find(c => c.gender === 'm') || {}).prizeCount || 3);
  const [bruttoPrizeDamen, setBruttoPrizeDamen] = useState((m.bruttoClasses && m.bruttoClasses.find(c => c.gender === 'w') || {}).prizeCount || 3);
  // Nur bei fester Klassifizierung relevant: jede Klasse (Herren/Damen/AK.../Jugend) kann eine
  // andere Anzahl Runden spielen und von einem anderen Abschlag – z. B. Herren 3 Runden von Weiß,
  // Damen 2 Runden von Blau, AK-Klassen und Jugend 2 Runden von Gelb.
  const defaultClassConfig = (rds) => {
    const allIds = rds.map(r => r.id);
    const first2 = allIds.slice(0, Math.min(2, allIds.length));
    return {
      Herren: { rounds: allIds, tee: 'Weiß' },
      Damen: { rounds: first2, tee: 'Blau' },
      AK30: { rounds: first2, tee: 'Gelb' },
      AK50: { rounds: first2, tee: 'Gelb' },
      AK65: { rounds: first2, tee: 'Gelb' },
      Jugend: { rounds: first2, tee: 'Gelb' },
    };
  };
  const [classConfig, setClassConfig] = useState(m.classConfig || defaultClassConfig(m.rounds || [{ id: 1, label: 'Runde 1' }, { id: 2, label: 'Runde 2' }]));
  const toggleClassRound = (cls, roundId) => {
    setClassConfig(prev => {
      const cur = prev[cls] || { rounds: [], tee: 'Weiß' };
      const has = cur.rounds.includes(roundId);
      const nextRounds = has ? cur.rounds.filter(id => id !== roundId) : [...cur.rounds, roundId].sort((a, b) => a - b);
      return { ...prev, [cls]: { ...cur, rounds: nextRounds } };
    });
  };
  const setClassTeeVal = (cls, tee) => {
    setClassConfig(prev => ({ ...prev, [cls]: { ...(prev[cls] || { rounds: [] }), tee } }));
  };
  const [saving, setSaving] = useState(false);
  const [saved, setSaved] = useState(false);

  useEffect(() => {
    if (type === 'clubmeisterschaft') setClassificationMode('fixed');
    else setClassificationMode('hcp');
  }, [type]);

  // Sinnvoller Standard je Turnierart, admin kann trotzdem jederzeit umstellen
  const suggestScoringMode = (t) => (t === 'clubmeisterschaft' || t === 'masters') ? 'strokeplay_net' : 'stableford';
  const scoringModeTouched = useRef(!!m.scoringMode);
  useEffect(() => {
    if (!scoringModeTouched.current) setScoringMode(suggestScoringMode(type));
  }, [type]);

  const setHcpCount = (n) => {
    const next = HCP_LETTERS.slice(0, n).map((letter, i) => hcpClasses[i] || { id: letter, from: '', to: '', prizeCount: 3 });
    setHcpClasses(next);
  };
  const updateCutoff = (i, field, val) => {
    const next = [...hcpClasses];
    next[i] = { ...next[i], [field]: val };
    setHcpClasses(next);
  };
  const updateRoundLabel = (i, val) => {
    const next = [...rounds];
    next[i] = { ...next[i], label: val };
    setRounds(next);
  };
  const addRound = () => setRounds([...rounds, { id: (rounds[rounds.length - 1]?.id || 0) + 1, label: `Runde ${rounds.length + 1}` }]);
  const removeRound = (i) => setRounds(rounds.filter((_, idx) => idx !== i));

  const save = async () => {
    setSaving(true);
    const bruttoClasses = bruttoSplit
      ? [
          { id: 'BruttoHerren', label: 'Brutto Herren', gender: 'm', prizeCount: bruttoPrizeHerren },
          { id: 'BruttoDamen', label: 'Brutto Damen', gender: 'w', prizeCount: bruttoPrizeDamen },
        ]
      : [{ id: 'Brutto', label: 'Brutto', prizeCount: bruttoPrizeCombined }];
    const meta = {
      name, type, holes, classificationMode,
      fixedClasses: FIXED_CLASSES,
      hcpClasses: classificationMode === 'hcp' ? hcpClasses : [],
      rounds, adminPin,
      scoringMode,
      herrenTee, damenTee,
      classConfig,
      bruttoClasses,
    };
    await fbPatch('tournament/meta', meta);
    await reload();
    setSaving(false);
    setSaved(true);
    setTimeout(() => setSaved(false), 2000);
  };

  return (
    <div style={{ background: C.card, border: `1px solid ${C.line}`, borderRadius: 12, padding: 20 }}>
      <Field label="Turniername">
        <input value={name} onChange={e => setName(e.target.value)} placeholder="z. B. Clubmeisterschaft 2026" style={inputStyle} />
      </Field>
      <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 12 }}>
        <Field label="Turnierart">
          <select value={type} onChange={e => setType(e.target.value)} style={inputStyle}>
            {TOURNAMENT_TYPES.map(t => <option key={t.id} value={t.id}>{t.label}</option>)}
          </select>
        </Field>
        <Field label="Lochanzahl">
          <select value={holes} onChange={e => setHoles(Number(e.target.value))} style={inputStyle}>
            <option value={18}>18 Loch</option>
            <option value={9}>9 Loch</option>
          </select>
        </Field>
      </div>

      <Field label="Scoring-Modus">
        <select value={scoringMode} onChange={e => { scoringModeTouched.current = true; setScoringMode(e.target.value); }} style={inputStyle}>
          <option value="strokeplay_net">Zählspiel Netto (Brutto minus Gesamtvorgabe)</option>
          <option value="stableford">Stableford (Brutto- & Netto-Punkte pro Loch)</option>
        </select>
      </Field>

      <Field label="Runden">
        <div style={{ display: 'flex', flexDirection: 'column', gap: 6 }}>
          {rounds.map((r, i) => (
            <div key={i} style={{ display: 'flex', gap: 6 }}>
              <input value={r.label} onChange={e => updateRoundLabel(i, e.target.value)} style={{ ...inputStyle, flex: 1 }} />
              {rounds.length > 1 && <button onClick={() => removeRound(i)} style={smallBtn}>Entfernen</button>}
            </div>
          ))}
          <button onClick={addRound} style={{ ...smallBtn, alignSelf: 'flex-start' }}>+ Runde hinzufügen</button>
        </div>
      </Field>

      <Field label="Brutto-Wertung">
        <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 10 }}>
          <input type="checkbox" checked={bruttoSplit} onChange={e => setBruttoSplit(e.target.checked)} id="bruttoSplit" />
          <label htmlFor="bruttoSplit" style={{ fontSize: 13, color: C.inkDim }}>Brutto nach Geschlecht trennen (Herren/Damen getrennt gewertet)</label>
        </div>
        {bruttoSplit ? (
          <div style={{ display: 'flex', gap: 16 }}>
            <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
              <span style={{ fontSize: 13, color: C.inkDim }}>Preise Brutto Herren</span>
              <select value={bruttoPrizeHerren} onChange={e => setBruttoPrizeHerren(Number(e.target.value))} style={{ ...inputStyle, width: 70 }}>
                {[1, 2, 3].map(n => <option key={n} value={n}>{n}</option>)}
              </select>
            </div>
            <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
              <span style={{ fontSize: 13, color: C.inkDim }}>Preise Brutto Damen</span>
              <select value={bruttoPrizeDamen} onChange={e => setBruttoPrizeDamen(Number(e.target.value))} style={{ ...inputStyle, width: 70 }}>
                {[1, 2, 3].map(n => <option key={n} value={n}>{n}</option>)}
              </select>
            </div>
          </div>
        ) : (
          <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
            <span style={{ fontSize: 13, color: C.inkDim }}>Preise Brutto (gesamt)</span>
            <select value={bruttoPrizeCombined} onChange={e => setBruttoPrizeCombined(Number(e.target.value))} style={{ ...inputStyle, width: 70 }}>

            </select>
          </div>

      </Field>

      <Field label={type === 'clubmeisterschaft' ? 'Klassifizierung: Runden & Abschlag je Klasse' : 'Netto-Wertung: Handicap-Klassen'}>
        {classificationMode === 'fixed' ? (
          <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
            {FIXED_CLASSES.map(cls => {
              const cfg = classConfig[cls] || { rounds: [], tee: 'Weiß' };
              return (

              <span style={{ fontSize: 13, color: C.inkDim }}>Anzahl Handicap-Klassen</span>
              <select value={hcpClasses.length} onChange={e => setHcpCount(Number(e.target.value))} style={{ ...inputStyle, width: 70 }}>
                {[1, 2, 3, 4].map(n => <option key={n} value={n}>{n}</option>)}
              </select>

              <div key={c.id} style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 6 }}>

                <input type="number" placeholder="bis" value={c.to} onChange={e => updateCutoff(i, 'to', e.target.value)} style={{ ...inputStyle, width: 80 }} />
                <span style={{ fontSize: 12, color: C.muted, marginLeft: 8 }}>Preise</span>
                <select value={c.prizeCount || 3} onChange={e => updateCutoff(i, 'prizeCount', Number(e.target.value))} style={{ ...inputStyle, width: 60 }}>
                  {[1, 2, 3].map(n => <option key={n} value={n}>{n}</option>)}
                </select>
              </div>
            ))}
          </div>
        )}
      </Field>

      {classificationMode !== 'fixed' && (
        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 12 }}>
          <Field label="Herren spielen von">
            <select value={herrenTee} onChange={e => setHerrenTee(e.target.value)} style={inputStyle}>
              <option value="Weiß">Weiß (CR 72.8)</option>
              <option value="Gelb">Gelb (CR 71.1)</option>
            </select>
          </Field>
          <Field label="Damen spielen von">
            <select value={damenTee} onChange={e => setDamenTee(e.target.value)} style={inputStyle}>
              <option value="Blau">Blau (CR 74.5)</option>
              <option value="Rot">Rot (CR 72.4)</option>
            </select>
          </Field>
        </div>
      )}

      <Field label="Platzkarte: Par & Vorgabe (Stroke Index)">
        <div style={{ fontSize: 12, color: C.muted, marginBottom: 10 }}>Fest hinterlegt für GC Landshut, gilt für alle Turniere und alle vier Tees gleichermaßen – nicht editierbar. Die eigentliche Course-Handicap-Zahl kommt pro Spieler aus der Startliste.</div>
        <div style={{ fontSize: 11, fontWeight: 600, color: C.inkDim, marginBottom: 4 }}>Par</div>
        <div style={{ display: 'flex', gap: 4, flexWrap: 'wrap', marginBottom: 10 }}>

              style={{ width: 28, textAlign: 'center', fontSize: 11, color: C.inkDim, background: C.board, borderRadius: 4, padding: '4px 0' }}>{v}</span>

    </div>
  );

function PlayerAdmin({ tournament, reload }) {
  const players = (tournament && tournament.players) || {};
  const meta = (tournament && tournament.meta) || {};
  const [name, setName] = useState('');
  const [hcp, setHcp] = useState('');
  const [cls, setCls] = useState(meta.classificationMode === 'fixed' ? FIXED_CLASSES[0] : '');
  const [geschlecht, setGeschlecht] = useState('m');
  const fileRef = useRef(null);

  // Tee wird automatisch aus Geschlecht + Turniereinstellung (Herren/Damen spielen von...) abgeleitet.
  const teeForGeschlecht = (g) => g === 'w' ? (meta.damenTee || 'Blau') : (meta.herrenTee || 'Weiß');

  const addPlayer = async () => {
    if (!name || hcp === '') return;
    const id = newId();
    await fbPatch('tournament/players/' + id, { name, hcp: Number(hcp), classes: cls ? [cls] : [], geschlecht, tee: teeForGeschlecht(geschlecht) });
    setName(''); setHcp('');
    await reload();
  };

  const removePlayer = async (id) => {
    await fbPut('tournament/players/' + id, null);
    await reload();
  };

  // CSV-Spalten: name,handicap,klasse,geschlecht,flight  (klasse nur bei fester Klassifizierung nötig, geschlecht = m/w, flight optional)
  // Ist eine Flight-Spalte gefüllt, werden Spieler automatisch zu Flights gruppiert und
  // pro Flight-Namen ein Link + Passwort erzeugt.
  const handleFile = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = async (ev) => {
      const text = ev.target.result;
      const lines = text.split(/\r?\n/).filter(l => l.trim());
      const playerUpdates = {};
      const flightGroups = {}; // flightName -> [playerId, ...]
      const isFixed = meta.classificationMode === 'fixed';
      lines.forEach(line => {
        const parts = line.split(',').map(s => s && s.trim());
        const pname = parts[0], phcp = parts[1];
        let idx = 2;
        const pcls = isFixed ? parts[idx++] : undefined;
        const pg = (parts[idx] === 'w' || parts[idx] === 'm') ? parts[idx++] : 'm';
        const pflight = parts[idx];
        if (!pname || phcp === undefined) return;
        const id = newId();
        playerUpdates[id] = { name: pname, hcp: Number(phcp), classes: pcls ? [pcls] : [], geschlecht: pg, tee: teeForGeschlecht(pg) };
        if (pflight) {
          if (!flightGroups[pflight]) flightGroups[pflight] = [];
          flightGroups[pflight].push(id);
        }
      });
      await fbPatch('tournament/players', playerUpdates);

      const flightUpdates = {};
      Object.entries(flightGroups).forEach(([flightName, playerIds]) => {
        const fid = newId();
        flightUpdates[fid] = { name: flightName, playerIds, token: genToken(), password: genPassword() };
      });
      if (Object.keys(flightUpdates).length > 0) {
        await fbPatch('tournament/flights', flightUpdates);
      }

      await reload();
      fileRef.current.value = '';
    };
    reader.readAsText(file);
  };

  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 16 }}>
      <div style={{ background: C.card, border: `1px solid ${C.line}`, borderRadius: 12, padding: 20 }}>
        <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 10 }}>
          <span style={{ fontSize: 13, color: C.inkDim }}>
            CSV hochladen: name,handicap{meta.classificationMode === 'fixed' ? ',klasse' : ''},tee,flight
            <br /><span style={{ fontSize: 11 }}>tee = Weiß/Gelb/Blau/Rot (optional, Standard Weiß). Flight-Spalte optional – gleicher Flight-Name gruppiert automatisch, Link + Passwort werden erzeugt.</span>
          </span>
          <button onClick={() => fileRef.current.click()} style={smallBtn}>Datei wählen</button>
          <input ref={fileRef} type="file" accept=".csv,text/csv" onChange={handleFile} style={{ display: 'none' }} />
        </div>
      </div>

      <div style={{ background: C.card, border: `1px solid ${C.line}`, borderRadius: 12, padding: 20 }}>
        <div style={{ fontSize: 13, color: C.inkDim, marginBottom: 10 }}>Spieler manuell hinzufügen</div>
        <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap' }}>
          <input placeholder="Name" value={name} onChange={e => setName(e.target.value)} style={{ ...inputStyle, flex: 1, minWidth: 140 }} />
          <input placeholder="Hcp" type="number" value={hcp} onChange={e => setHcp(e.target.value)} style={{ ...inputStyle, width: 80 }} />
          {meta.classificationMode === 'fixed' && (
            <select value={cls} onChange={e => setCls(e.target.value)} style={{ ...inputStyle, width: 110 }}>
              {FIXED_CLASSES.map(c => <option key={c} value={c}>{c}</option>)}
            </select>
          )}
          <select value={geschlecht} onChange={e => setGeschlecht(e.target.value)} style={{ ...inputStyle, width: 110 }}>
            <option value="m">Herr</option>
            <option value="w">Dame</option>
          </select>
          <button onClick={addPlayer} style={smallBtn}>+ Hinzufügen</button>
        </div>
      </div>

      <div style={{ background: C.card, border: `1px solid ${C.line}`, borderRadius: 12, overflow: 'hidden' }}>
        {Object.entries(players).map(([id, p]) => (
          <div key={id} style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: '10px 16px', borderBottom: `1px solid ${C.line}` }}>
            <div>
              <span style={{ fontSize: 14, fontWeight: 500 }}>{p.name}</span>
              <span style={{ fontSize: 12, color: C.muted, marginLeft: 8 }}>Hcp {p.hcp} · {p.geschlecht === 'w' ? 'Dame' : 'Herr'} · Tee {p.tee || teeForGeschlecht(p.geschlecht)} {p.classes && p.classes.length ? '· ' + p.classes.join(', ') : ''}</span>
            </div>
            <button onClick={() => removePlayer(id)} style={{ ...smallBtn, color: C.red }}>Entfernen</button>
          </div>
        ))}
        {Object.keys(players).length === 0 && <div style={{ padding: 20, textAlign: 'center', color: C.muted, fontSize: 13 }}>Noch keine Spieler angelegt.</div>}
      </div>
    </div>
  );
}

            <div style={{ fontSize: 12, color: C.inkDim, wordBreak: 'break-all', background: C.board, padding: '8px 10px', borderRadius: 6 }}>
              {baseUrl}?m={f.token}
            </div>
            <div style={{ fontSize: 12, color: C.inkDim, marginTop: 4 }}>Passwort: <b>{f.password}</b></div>
          </div>
        ))}
        {Object.keys(flights).length === 0 && <div style={{ color: C.muted, fontSize: 13, padding: 10 }}>Noch keine Flights angelegt.</div>}

// ============================================================
// PUBLIC LEADERBOARD

function PublicLeaderboard({ tournament, err }) {
  if (err) return <div className="wrap" style={{ textAlign: 'center', color: C.red, paddingTop: '20vh' }}>{err}</div>;
  if (!tournament || !tournament.meta) {
    return (
      <div className="wrap" style={{ textAlign: 'center', paddingTop: '20vh', color: C.muted }}>
        Noch kein Turnier angelegt.<br />
        <a href="?admin=1" style={{ color: C.accent }}>Zum Admin-Bereich</a>
      </div>
    );
  }
  const m = tournament.meta;
  const players = tournament.players || {};
  const flights = tournament.flights || {};
  const scores = tournament.scores || {};

  // Brutto- und Netto-Klassen mit jeweils eigener Preisrang-Anzahl. Abwärtskompatibel: falls noch keine
  // bruttoClasses gespeichert sind (ältere Turniere), wird eine einzelne kombinierte Brutto-Klasse angenommen.
  const bruttoClasses = m.bruttoClasses || [{ id: 'Brutto', label: 'Brutto', prizeCount: m.prizeCount || 3 }];
  const hcpClassesWithPrize = (m.hcpClasses || []).map(c => ({ ...c, prizeCount: c.prizeCount || 3 }));

  const NETTO_CM_ID = 'NettoCM';
  const showNettoCM = m.classificationMode === 'fixed' && m.type === 'clubmeisterschaft';

  const classIds = m.classificationMode === 'fixed'
    ? [...m.fixedClasses, ...(showNettoCM ? [NETTO_CM_ID] : [])]
    : [...bruttoClasses.map(c => c.id), ...hcpClassesWithPrize.map(c => c.id)];
  const [activeClass, setActiveClass] = useState(classIds[0]);
  const [activeRound, setActiveRound] = useState((m.rounds && m.rounds[m.rounds.length - 1].id) || 1);
  const [detailPlayer, setDetailPlayer] = useState(null);

  useEffect(() => { if (!classIds.includes(activeClass)) setActiveClass(classIds[0]); }, [m.classificationMode]);

  // Erkennt, ob dieses Gerät bereits bei einem Flight für die Score-Eingabe angemeldet war,
  // damit der Zurück-Button auf die richtige Scorekarte verlinkt.
  const myFlightToken = Object.entries(flights).find(
    ([fid]) => localStorage.getItem('ls_auth_' + fid) === '1'
  )?.[1]?.token || null;

  // Alle Scores eines Spielers über eine Runde finden (Flight-Zuordnung)
  const findPlayerRoundScores = (playerId, roundId) => {
    for (const fid of Object.keys(flights)) {
      const f = flights[fid];
      if ((f.playerIds || []).includes(playerId)) {
        return (scores[fid] && scores[fid][roundId] && scores[fid][roundId][playerId]) || {};
      }
    }
    return {};
  };

  // Summiert Schläge UND das Par der tatsächlich gespielten Löcher über alle Runden,
  // damit wir "brutto/netto relativ zum Par" korrekt anzeigen können (wie bei Turnier-Leaderboards üblich).
  const isStableford = m.scoringMode === 'stableford';

  const totalsAcrossRounds = (playerId, roundList) => {
    let gross = 0, par = 0, any = false;
    (roundList || m.rounds || []).forEach(r => {
      const s = findPlayerRoundScores(playerId, r.id);
      Object.entries(s).forEach(([holeIdx, val]) => {
        if (!isNumericScore(val)) return;
        gross += Number(val);
        par += courseFor(m.holes).pars[Number(holeIdx)] || 0;
        any = true;
      });
    });
    return any ? { gross, par } : { gross: null, par: null };
  };

  // Stableford: Brutto- und Netto-Punkte pro Loch aufsummiert, Strich = 0 Punkte für beide.
  // GBE (Zählspielschläge) bleibt "unvollständig", sobald ein Strich vorkommt.
  const stablefordTotalsAcrossRounds = (playerId, hcp, tee, roundList) => {
    let grossPts = 0, netPts = 0, gbe = 0, played = false, strich = false;
    (roundList || m.rounds || []).forEach(r => {
      const s = findPlayerRoundScores(playerId, r.id);
      Object.entries(s).forEach(([holeIdxStr, val]) => {
        if (!isEntered(val)) return;
        played = true;
        const holeIdx = Number(holeIdxStr);
        const par = courseFor(m.holes).pars[holeIdx];
        const si = courseFor(m.holes).si[holeIdx];
        if (val === STRICH) {
          strich = true;
          grossPts += 0; netPts += 0;
          return;
        }
        const score = Number(val);
        gbe += score;
        grossPts += stablefordPoints(score - par);
        const net = score - strokesOnHole(hcp, si, m.holes);
        netPts += stablefordPoints(net - par);
      });
    });
    return played ? { grossPts, netPts, gbe: strich ? null : gbe } : { grossPts: null, netPts: null, gbe: null };
  };

  const rows = Object.entries(players).map(([id, p]) => {
    const thruScores = findPlayerRoundScores(id, activeRound);
    // Bei fester Klassifizierung zählt für Brutto nur die Rundenauswahl der eigenen Klasse
    // (z. B. Herren 3 Runden, Damen 2 Runden).
    const playerClass = (p.classes && p.classes[0]) || null;
    const classRounds = m.classificationMode === 'fixed' && playerClass ? classRoundsFor(m, playerClass) : (m.rounds || []);
    // Netto-Klubmeisterschaft läuft als eigenständige Stableford-Netto-Wertung, unabhängig vom
    // gewählten Haupt-Scoring-Modus des Turniers (Zählspiel für die Brutto-Klassen) – ebenfalls
    // nur über die Runden der eigenen Klasse, damit Herren (3 Runden) und Damen (2 Runden) fair
    // anhand ihrer jeweiligen Baseline verglichen werden.
    const cmNettoRaw = showNettoCM ? stablefordTotalsAcrossRounds(id, p.hcp, p.tee, classRounds).netPts : null;
    const cmNettoBaselineRow = classRounds.length * m.holes * 2;
    const cmNettoDiff = cmNettoRaw === null ? null : cmNettoRaw - cmNettoBaselineRow;
    if (isStableford) {
      const { grossPts, netPts, gbe } = stablefordTotalsAcrossRounds(id, p.hcp, p.tee, classRounds);
      return { id, ...p, grossPts, netPts, gbe, cmNettoRaw, cmNettoDiff, thru: holesPlayed(thruScores) };
    }
    const { gross, par } = totalsAcrossRounds(id, classRounds);
    const grossToPar = gross === null ? null : gross - par;
    const net = gross === null ? null : Math.round(gross - p.hcp);
    const netToPar = net === null ? null : net - par;
    return { id, ...p, gross, grossToPar, net, netToPar, cmNettoRaw, cmNettoDiff, thru: holesPlayed(thruScores) };
  });

  const fmtToPar = (v) => v === null ? '–' : v === 0 ? 'E' : v > 0 ? '+' + v : String(v);
  // Score-Farbe nach Par: unter Par rot, ausgeglichen "PAR" in grau, über Par schwarz.
  const scoreColorFor = (v) => v === null ? C.muted : v === 0 ? C.muted : v < 0 ? C.red : C.ink;
  const scoreTextFor = (v) => v === null ? '–' : v === 0 ? 'PAR' : v > 0 ? '+' + v : String(v);

  // Ermittelt den Brutto-Sieger für eine bestimmte Brutto-Klasse (ggf. nach Geschlecht gefiltert),
  // für die Ausschluss-Regel: wer Brutto gewinnt, kann in der zugehörigen Netto-Klasse nicht auch Sieger sein.
  const bruttoLeaderIdFor = (geschlecht) => {
    if (!isStableford) return null;
    const relevantClass = bruttoClasses.find(c => !c.gender || c.gender === geschlecht) || bruttoClasses[0];
    const candidates = rows
      .filter(r => r.grossPts !== null && (!relevantClass.gender || r.geschlecht === relevantClass.gender))
      .sort((a, b) => b.grossPts - a.grossPts);
    return candidates.length ? candidates[0].id : null;
  };

  const activeBruttoClass = bruttoClasses.find(c => c.id === activeClass);
  const activeHcpClass = hcpClassesWithPrize.find(c => c.id === activeClass);

  let visibleRows;
  if (activeClass === NETTO_CM_ID) {
    // Netto-Klubmeisterschaft: eine einzige kombinierte Wertung über alle Teilnehmer, unabhängig von Klasse.
    visibleRows = rows.filter(r => r.cmNettoDiff !== null);
    visibleRows.sort((a, b) => (b.cmNettoDiff ?? -999) - (a.cmNettoDiff ?? -999));
  } else if (m.classificationMode === 'fixed') {
    // Feste Klassen (Herren/Damen/AK/Jugend) entscheiden nach Brutto.
    visibleRows = rows.filter(r => (r.classes || []).includes(activeClass));
    visibleRows.sort((a, b) => (a.grossToPar ?? 999) - (b.grossToPar ?? 999));
  } else if (activeBruttoClass) {
    visibleRows = rows.filter(r => (isStableford ? r.grossPts !== null : r.gross !== null) && (!activeBruttoClass.gender || r.geschlecht === activeBruttoClass.gender));
    visibleRows.sort((a, b) => isStableford ? (b.grossPts ?? -1) - (a.grossPts ?? -1) : (a.grossToPar ?? 999) - (b.grossToPar ?? 999));
  } else {
    visibleRows = rows.filter(r => playerHcpClass(r.hcp, hcpClassesWithPrize) === activeClass);
    visibleRows.sort((a, b) => isStableford ? (b.netPts ?? -1) - (a.netPts ?? -1) : (a.netToPar ?? 999) - (b.netToPar ?? 999));
  }

  // Ausschluss-Regel anwenden: wenn der Tabellenführer dieser Netto-Ansicht der (ggf. geschlechtsspezifische)
  // Brutto-Sieger ist, wandert die Sieger-Markierung auf den nächstplatzierten Spieler.
  let leaderIndex = visibleRows.length > 0 ? 0 : -1;
  let excludedNote = null;
  if (isStableford && activeHcpClass && leaderIndex === 0 && visibleRows[0] && visibleRows.length > 1) {
    const relevantBruttoLeader = bruttoLeaderIdFor(visibleRows[0].geschlecht);
    if (visibleRows[0].id === relevantBruttoLeader) {
      excludedNote = visibleRows[0].name;
      leaderIndex = 1;
    }
  }

  // Preisränge: 1.–3. Platz farblich abgestuft hervorgehoben, Anzahl je nach Klassen-Einstellung.
  // Ein durch die Ausschluss-Regel übersprungener Platz zählt nicht als Preisrang mit.
  const prizeCount = (activeBruttoClass || activeHcpClass || {}).prizeCount || 3;
  const PRIZE_TIERS = [
    { bg: 'rgba(29,122,76,0.24)', color: C.green, weight: 700, size: 17 },
    { bg: 'rgba(29,122,76,0.14)', color: C.green, weight: 600, size: 16 },
    { bg: 'rgba(29,122,76,0.07)', color: C.ink, weight: 600, size: 15 },
  ];
  const prizeTierForRow = (i) => {
    if (excludedNote && i === 0) return null; // ausgeschlossener Spieler bekommt keinen Preisrang-Look
    const rank = excludedNote ? i - 1 : i;
    return rank < prizeCount ? PRIZE_TIERS[rank] : null;
  };

  return (
    <div className="wrap" style={{ maxWidth: 620 }}>
      {myFlightToken && (
        <a href={`?m=${myFlightToken}`} style={{
          display: 'block', textAlign: 'center', padding: '13px 0', marginBottom: 12,
          background: C.ink, color: '#fff', borderRadius: 10, fontSize: 15, fontWeight: 600, textDecoration: 'none'
        }}>
          ← Zurück zur Scorekarte
        </a>
      )}
      <div style={{ background: C.card, border: `1px solid ${C.line}`, borderRadius: 12, overflow: 'visible' }}>
        <div style={{ position: 'relative', height: 150, borderRadius: '12px 12px 0 0', overflow: 'hidden', backgroundImage: `url(${HEADER_PHOTO})`, backgroundSize: 'cover', backgroundPosition: 'center 68%' }}>
          <div style={{ position: 'absolute', inset: 0, background: 'rgba(20,24,18,0.55)' }} />
          <img src={CLUB_LOGO} alt="GC Landshut Logo" style={{ position: 'absolute', left: 16, top: 16, width: 46, height: 46, borderRadius: '50%' }} />
          <div style={{ position: 'absolute', left: 0, right: 0, bottom: 16, textAlign: 'center' }}>
            <div style={{ fontFamily: "'Cinzel', serif", fontSize: 24, fontWeight: 600, color: '#fff', letterSpacing: '0.03em' }}>Livescoring</div>
          </div>
        </div>
        <div style={{ position: 'relative', textAlign: 'center', paddingTop: 14, borderBottom: `1px solid ${C.line}` }}>
          <div style={{ position: 'absolute', left: '50%', top: -14, transform: 'translateX(-50%)', display: 'inline-flex', alignItems: 'center', gap: 5, background: C.red, color: '#fff', fontSize: 11, padding: '4px 12px', borderRadius: 20, border: `2px solid ${C.card}`, whiteSpace: 'nowrap' }}>
            <span style={{ width: 6, height: 6, borderRadius: '50%', background: '#fff' }} />live
          </div>
          <div style={{ fontSize: 11, color: C.muted, paddingBottom: 12 }}>{m.name || 'Turnier'}</div>
        </div>

        {m.rounds && m.rounds.length > 1 && (
          <div style={{ display: 'flex', gap: 6, padding: '10px 16px', borderBottom: `1px solid ${C.line}`, overflowX: 'auto' }}>
            {m.rounds.map(r => (
              <button key={r.id} onClick={() => setActiveRound(r.id)}
                style={{ flexShrink: 0, fontSize: 12, padding: '5px 12px', borderRadius: 6, border: `1px solid ${activeRound === r.id ? C.ink : C.line}`, background: activeRound === r.id ? C.ink : '#fff', color: activeRound === r.id ? '#fff' : C.ink, cursor: 'pointer' }}>
                {r.label}
              </button>
            ))}
          </div>
        )}

        <div style={{ display: 'flex', gap: 6, padding: '12px 16px', borderBottom: `1px solid ${C.line}`, overflowX: 'auto' }}>
          {classIds.map(c => {
            const bc = bruttoClasses.find(x => x.id === c);
            const label = c === NETTO_CM_ID ? 'Netto-Klubmeisterschaft' : (bc ? bc.label : (m.classificationMode === 'fixed' ? c : `Netto ${c}`));
            return (
            <button key={c} onClick={() => setActiveClass(c)}
              style={{ flexShrink: 0, fontSize: 12, padding: '5px 12px', borderRadius: 6, border: `1px solid ${activeClass === c ? C.ink : C.line}`, background: activeClass === c ? C.ink : '#fff', color: activeClass === c ? '#fff' : C.ink, cursor: 'pointer' }}>
              {label}
            </button>
            );
          })}
        </div>

        {excludedNote && (
          <div style={{ padding: '8px 20px', fontSize: 11, color: C.muted, background: C.board, borderBottom: `1px solid ${C.line}` }}>
            {lastNameFirst(excludedNote)} führt in Netto, hat aber bereits Brutto gewonnen – Netto-Sieg geht an Platz 2.
          </div>
        )}

        <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'flex-end', gap: 18, padding: '8px 20px 4px', borderBottom: `1px solid ${C.line}` }}>
          <div style={{ textAlign: 'center', minWidth: 54, fontSize: 11, color: C.muted, fontWeight: 600 }}>Total</div>
          <div style={{ textAlign: 'center', minWidth: 30, fontSize: 11, color: C.muted, fontWeight: 600 }}>Loch</div>
        </div>

        <div>
          {visibleRows.map((r, i) => {
            const tier = prizeTierForRow(i);
            return (
            <div key={r.id} onClick={() => setDetailPlayer(r.id)}
              style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: '12px 20px', background: tier ? tier.bg : 'transparent', borderBottom: `1px solid ${C.line}`, cursor: 'pointer' }}>
              <div style={{ display: 'flex', alignItems: 'center', gap: 14 }}>
                <span style={{ fontSize: 13, color: C.muted, width: 18, fontWeight: 600 }}>{i + 1}</span>
                <div style={{ display: 'flex', alignItems: 'baseline', gap: 7 }}>
                  <span style={{ fontSize: tier ? tier.size : 15, fontWeight: tier ? tier.weight : 500, color: tier ? tier.color : C.ink }}>{lastNameFirst(r.name)}{isStableford && activeHcpClass && r.id === bruttoLeaderIdFor(r.geschlecht) ? ' 🏆' : ''}</span>
                  <span style={{ fontSize: 11, color: C.muted }}>Hcp {r.hcp}</span>
                </div>
              </div>
              <div style={{ display: 'flex', alignItems: 'center', gap: 18 }}>
                <div style={{ textAlign: 'center', minWidth: 54 }}>
                  {activeClass === NETTO_CM_ID ? (
                    <div style={{ fontSize: tier ? tier.size : 16, fontWeight: tier ? tier.weight : 600, color: scoreColorFor(r.cmNettoDiff) }}>
                      {scoreTextFor(r.cmNettoDiff)}
                    </div>
                  ) : isStableford ? (
                    <div style={{ fontSize: tier ? tier.size : 16, fontWeight: tier ? tier.weight : 600, color: tier ? tier.color : C.ink }}>
                      {(activeBruttoClass ? r.grossPts : r.netPts) ?? '–'} Pkt.
                    </div>
                  ) : (
                    <div style={{ fontSize: tier ? tier.size : 16, fontWeight: tier ? tier.weight : 600, color: scoreColorFor(activeBruttoClass ? r.grossToPar : r.netToPar) }}>
                      {scoreTextFor(activeBruttoClass ? r.grossToPar : r.netToPar)}
                    </div>
                  )}
                </div>
                <div style={{ textAlign: 'center', minWidth: 30 }}>
                  <div style={{ fontSize: 15, color: C.muted }}>{r.thru}</div>
                </div>
              </div>
            </div>
            );
          })}
          {visibleRows.length === 0 && <div style={{ padding: 24, textAlign: 'center', color: C.muted, fontSize: 13 }}>Noch keine Spieler in dieser Klasse.</div>}
        </div>
      </div>

      {detailPlayer && (
        <ScoreDetailModal
          tournament={tournament}
          playerId={detailPlayer}
          initialRound={activeRound}
          findPlayerRoundScores={findPlayerRoundScores}
          onClose={() => setDetailPlayer(null)}
        />
      )}
    </div>
  );
}

function ScoreDetailModal({ tournament, playerId, initialRound, findPlayerRoundScores, onClose }) {
  const m = tournament.meta;
  const p = tournament.players[playerId];
  const playerClass = (p.classes && p.classes[0]) || null;
  const modalRounds = m.classificationMode === 'fixed' && playerClass ? classRoundsFor(m, playerClass) : (m.rounds || []);
  const [round, setRound] = useState(modalRounds.some(r => r.id === initialRound) ? initialRound : (modalRounds[modalRounds.length - 1] || {}).id);
  const scores = findPlayerRoundScores(playerId, round);
  const holes = m.holes;
  const { pars, si } = courseFor(holes);

  const scoreStyle = (diff) => {
    if (diff <= -2) return { bg: C.eagle, col: '#3d2e00' };
    if (diff === -1) return { bg: C.birdie, col: '#fff' };
    if (diff === 0) return { bg: 'transparent', col: C.ink };
    if (diff === 1) return { bg: C.bogey, col: '#fff' };
    return { bg: C.dblbogey, col: '#fff' };
  };

  const isStableford = m.scoringMode === 'stableford';

  const renderBlock = (startIdx, count) => {
    const cells = [];
    let blockSum = 0, blockHasAny = false;
    for (let i = startIdx; i < startIdx + count; i++) {
      const s = scores[i];
      const struck = s === STRICH;
      const hasScore = isNumericScore(s);
      if (hasScore) { blockSum += Number(s); blockHasAny = true; }
      const diff = hasScore ? Number(s) - pars[i] : null;
      const st = hasScore ? scoreStyle(diff) : { bg: 'transparent', col: C.muted };
      // Netto-Stableford-Punkte klein in der Ecke, damit man auf einen Blick nachvollziehen kann,
      // wie sich die Nettopunkte pro Loch zusammensetzen (Vorgabe-Schlag + Punkte-Skala).
      let netPtsBadge = null;
      if (isStableford && hasScore) {
        const strokes = strokesOnHole(p.hcp, si[i], holes);
        const netScore = Number(s) - strokes;
        const netPts = stablefordPoints(netScore - pars[i]);
        netPtsBadge = netPts;
      }
      cells.push(
        <td key={i} style={{ padding: '7px 2px', textAlign: 'center' }}>
          <span style={{ position: 'relative', display: 'inline-flex', width: 26, height: 26, alignItems: 'center', justifyContent: 'center', borderRadius: '50%', background: st.bg, color: st.col, fontWeight: 500, fontSize: 13 }}>
            {hasScore ? s : struck ? '✕' : '–'}
            {netPtsBadge !== null && (
              <span style={{ position: 'absolute', bottom: -3, right: -3, fontSize: 8, fontWeight: 600, color: C.accent }}>{netPtsBadge}</span>
            )}
          </span>
        </td>
      );
    }
    let holeRow = [], parRow = [];
    for (let i = startIdx; i < startIdx + count; i++) {
      holeRow.push(<td key={i} style={{ padding: '3px', textAlign: 'center', fontSize: 11, color: C.muted }}>{i + 1}</td>);
      parRow.push(
        <td key={i} style={{ padding: '3px', textAlign: 'center', fontSize: 11, color: C.muted, position: 'relative' }}>
          <span style={{ position: 'relative', display: 'inline-block' }}>
            {pars[i]}
            <span style={{ position: 'absolute', top: -8, right: -9, fontSize: 8, color: C.muted }}>{si[i]}</span>
          </span>
        </td>
      );
    }
    return (
      <table style={{ width: '100%', borderCollapse: 'collapse', marginBottom: 16 }}>
        <tbody>
          <tr><td style={{ padding: '3px 6px', fontSize: 10, color: C.muted, textAlign: 'left' }}>Loch</td>{holeRow}<td style={{ padding: '3px', textAlign: 'center', fontSize: 10, color: C.muted }}>{startIdx === 0 ? 'Out' : 'In'}</td></tr>
          <tr><td style={{ padding: '3px 6px', fontSize: 10, color: C.muted, textAlign: 'left' }}>Par</td>{parRow}<td /></tr>
          <tr style={{ background: C.board }}>
            <td style={{ padding: '5px 6px', fontSize: 11, fontWeight: 500, textAlign: 'left', borderTop: `1.5px solid ${C.ink}`, borderBottom: `1.5px solid ${C.ink}`, borderLeft: `1.5px solid ${C.ink}`, borderRadius: '6px 0 0 6px' }}>Score</td>
            {cells.map((c, idx) => React.cloneElement(c, { style: { ...c.props.style, borderTop: `1.5px solid ${C.ink}`, borderBottom: `1.5px solid ${C.ink}` } }))}
            <td style={{ padding: '5px 6px', textAlign: 'center', fontSize: 13, fontWeight: 600, borderTop: `1.5px solid ${C.ink}`, borderBottom: `1.5px solid ${C.ink}`, borderRight: `1.5px solid ${C.ink}`, borderRadius: '0 6px 6px 0' }}>
              {blockHasAny ? blockSum : '–'}
            </td>
          </tr>
        </tbody>
      </table>
    );
  };

  return (
    <div style={{ position: 'fixed', inset: 0, background: 'rgba(0,0,0,0.45)', display: 'flex', alignItems: 'center', justifyContent: 'center', padding: 16, zIndex: 50 }} onClick={onClose}>
      <div style={{ background: C.card, borderRadius: 12, width: '100%', maxWidth: 420, overflow: 'hidden' }} onClick={e => e.stopPropagation()}>
        <div style={{ padding: '16px 20px 0' }}>
          <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
            <div>
              <div style={{ fontSize: 16, fontWeight: 600 }}>{lastNameFirst(p.name)} <span style={{ fontSize: 12, fontWeight: 400, color: C.muted }}>(hcp {p.hcp} · {p.tee || TEE_IDS[0]})</span></div>
            </div>
            <button onClick={onClose} style={{ background: 'none', border: 'none', fontSize: 18, cursor: 'pointer', color: C.muted }}>×</button>
          </div>
          {modalRounds.length > 1 && (
            <div style={{ display: 'flex', gap: 6, margin: '12px 0' }}>
              {modalRounds.map(r => (
                <button key={r.id} onClick={() => setRound(r.id)}
                  style={{ fontSize: 12, padding: '5px 12px', borderRadius: 6, border: `1px solid ${round === r.id ? C.ink : C.line}`, background: round === r.id ? C.ink : '#fff', color: round === r.id ? '#fff' : C.ink, cursor: 'pointer' }}>
                  {r.label}
                </button>
              ))}
            </div>
          )}
        </div>
        <div style={{ padding: '0 20px 16px' }}>
          {renderBlock(0, holes === 18 ? 9 : holes)}
          {holes === 18 && renderBlock(9, 9)}
        </div>
      </div>
    </div>
  );
}

// ============================================================
// SOLO SCORE ENTRY
// ============================================================
function SoloEntry({ tournament, flightId, reload }) {
  const m = tournament.meta;
  const flight = tournament.flights[flightId];
  const players = (flight.playerIds || []).map(id => ({ id, ...tournament.players[id] }));
  const allFlightScores = (tournament.scores && tournament.scores[flightId]) || {};

  // Jeder Spieler hat (bei fester Klassifizierung) seine eigene Rundenliste, abhängig von seiner Klasse
  // (z. B. Herren 3 Runden, Damen 2 Runden) – wichtig bei gemischten Flights.
  const playerRoundIds = (p) => {
    const cls = p.classes && p.classes[0];
    return m.classificationMode === 'fixed' && cls ? classRoundIdsFor(m, cls) : (m.rounds || []).map(r => r.id);
  };
  const isPlayerRoundComplete = (p, roundId) => {
    const s = (allFlightScores[roundId] && allFlightScores[roundId][p.id]) || {};
    for (let h = 1; h <= m.holes; h++) { if (!isEntered(s[h - 1])) return false; }
    return true;
  };
  // Eine Runde ist für einen Spieler erst freigeschaltet, wenn seine eigene vorherige Runde
  // komplett eingetragen ist – Runde 3 z. B. darf nicht vor Abschluss von Runde 1+2 bespielt werden.
  const isRoundUnlockedForPlayer = (p, roundId) => {
    const ids = playerRoundIds(p);
    const idx = ids.indexOf(roundId);
    if (idx <= 0) return true;
    return isPlayerRoundComplete(p, ids[idx - 1]);
  };

  // Runden-Tabs: Vereinigung aller Runden, die für irgendein Flight-Mitglied relevant sind.
  const unionRoundIds = [...new Set(players.flatMap(playerRoundIds))];
  const flightRounds = (m.rounds || []).filter(r => unionRoundIds.includes(r.id));

  // Sinnvoller Start: die früheste Runde, die noch nicht von allen berechtigten Spielern
  // abgeschlossen ist – sonst die letzte Runde.
  const defaultRound = (() => {
    for (const r of flightRounds) {
      const eligible = players.filter(p => playerRoundIds(p).includes(r.id));
      if (eligible.some(p => !isPlayerRoundComplete(p, r.id))) return r.id;
    }
    return flightRounds.length ? flightRounds[flightRounds.length - 1].id : (m.rounds[m.rounds.length - 1] || {}).id;
  })();

  const [round, setRound] = useState(defaultRound);
  const [hole, setHole] = useState(1);
  const scores = (tournament.scores && tournament.scores[flightId] && tournament.scores[flightId][round]) || {};

  // Nur Spieler, für die diese Runde überhaupt zählt (z. B. keine Damen-Zeile in Runde 3).
  const eligiblePlayers = players.filter(p => playerRoundIds(p).includes(round));

  const setScore = async (playerId, val) => {
    await fbPatch(`tournament/scores/${flightId}/${round}/${playerId}`, { [hole - 1]: val });
    await reload();
  };

  // Übernimmt automatisch Par für alle berechtigten, nicht gesperrten Spieler, die an diesem Loch
  // noch nichts eingetragen haben, sobald man weiterblättert.
  const commitDefaultsAndGo = async (targetHole) => {
    const parVal = courseFor(m.holes).pars[hole - 1];
    const missing = eligiblePlayers.filter(p => isRoundUnlockedForPlayer(p, round) && !isEntered(scores[p.id] && scores[p.id][hole - 1]));
    if (missing.length > 0) {
      await Promise.all(missing.map(p => fbPatch(`tournament/scores/${flightId}/${round}/${p.id}`, { [hole - 1]: parVal })));
      await reload();
    }
    setHole(targetHole);
  };

  // Prüft für JEDES Loch einzeln, ob alle berechtigten Flight-Mitglieder eingetragen haben.
  const isHoleFilled = (h) => eligiblePlayers.length > 0 && eligiblePlayers.every(p => {
    const ps = (scores[p.id]) || {};
    return isEntered(ps[h - 1]);
  });

  return (
    <div className="wrap" style={{ maxWidth: 380 }}>
      <a href={window.location.pathname} style={{
        display: 'block', textAlign: 'center', padding: '13px 0', marginBottom: 12,
        background: C.ink, color: '#fff', borderRadius: 10, fontSize: 15, fontWeight: 600, textDecoration: 'none'
      }}>
        Live-Rangliste ansehen →
      </a>
      <div style={{ background: C.card, border: `1px solid ${C.line}`, borderRadius: 16, overflow: 'hidden' }}>
        <div style={{ padding: '14px 18px', borderBottom: `1px solid ${C.line}`, textAlign: 'center' }}>
          <div style={{ fontSize: 11, color: C.muted, textTransform: 'uppercase', letterSpacing: '0.05em' }}>{flight.name}</div>
          {flightRounds.length > 1 && (
            <div style={{ display: 'flex', gap: 6, justifyContent: 'center', marginTop: 8 }}>
              {flightRounds.map(r => {
                const eligibleForR = players.filter(p => playerRoundIds(p).includes(r.id));
                const anyUnlocked = eligibleForR.some(p => isRoundUnlockedForPlayer(p, r.id));
                return (
                  <button key={r.id} onClick={() => anyUnlocked && setRound(r.id)} disabled={!anyUnlocked}
                    style={{ fontSize: 12, padding: '5px 12px', borderRadius: 6, border: `1px solid ${round === r.id ? C.ink : C.line}`, background: round === r.id ? C.ink : '#fff', color: !anyUnlocked ? C.muted : (round === r.id ? '#fff' : C.ink), cursor: anyUnlocked ? 'pointer' : 'not-allowed', opacity: anyUnlocked ? 1 : 0.5 }}>
                    {anyUnlocked ? r.label : `🔒 ${r.label}`}
                  </button>
                );
              })}
            </div>
          )}
          <div style={{ display: 'flex', gap: 5, justifyContent: 'center', marginTop: 10, flexWrap: 'wrap' }}>
            {Array.from({ length: m.holes }).map((_, i) => {
              const n = i + 1;
              const filled = isHoleFilled(n);
              const active = n === hole;
              return <span key={n} onClick={() => commitDefaultsAndGo(n)} style={{ cursor: 'pointer', width: 7, height: 7, borderRadius: '50%', background: active ? C.accent : filled ? C.muted : C.line }} />;
            })}
          </div>
        </div>

        <div style={{ padding: 18, display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
          <button onClick={() => commitDefaultsAndGo(Math.max(1, hole - 1))} style={circleBtn}>‹</button>
          <div style={{ textAlign: 'center' }}>
            <div style={{ fontSize: 11, color: C.muted }}>Loch</div>
            <div style={{ fontSize: 32, fontWeight: 600 }}>{hole}</div>
            <div style={{ fontSize: 11, color: C.muted }}>Par {courseFor(m.holes).pars[hole - 1]}</div>
          </div>
          <button onClick={() => commitDefaultsAndGo(Math.min(m.holes, hole + 1))} style={circleBtn}>›</button>
        </div>

        <div style={{ padding: '4px 18px 18px', display: 'flex', flexDirection: 'column', gap: 10 }}>
          {eligiblePlayers.length === 0 && (
            <div style={{ fontSize: 12, color: C.muted, textAlign: 'center', padding: '10px 0' }}>Für diese Runde sind keine Spieler dieses Flights vorgesehen.</div>
          )}
          {eligiblePlayers.map(p => {
            const raw = scores[p.id] && scores[p.id][hole - 1];
            const struck = raw === STRICH;
            const cur = isNumericScore(raw) ? Number(raw) : courseFor(m.holes).pars[hole - 1];
            const playerSi = courseFor(m.holes).si[hole - 1];
            const unlocked = isRoundUnlockedForPlayer(p, round);
            if (!unlocked) {
              return (
                <div key={p.id} style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: '10px 12px', background: C.board, borderRadius: 8, opacity: 0.6 }}>
                  <div>
                    <div style={{ fontSize: 13, fontWeight: 500 }}>{p.name}</div>
                    <div style={{ fontSize: 10, color: C.muted }}>Hcp {p.hcp} · Tee {p.tee || TEE_IDS[0]}</div>
                  </div>
                  <span style={{ fontSize: 11, color: C.muted }}>🔒 vorherige Runde noch offen</span>
                </div>
              );
            }
            return (
              <div key={p.id} style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: '10px 12px', background: C.board, borderRadius: 8 }}>
                <div>
                  <div style={{ fontSize: 13, fontWeight: 500 }}>{p.name}</div>
                  <div style={{ fontSize: 10, color: C.muted }}>Hcp {p.hcp} · Tee {p.tee || TEE_IDS[0]} · Vorg. {playerSi}</div>
                </div>
                <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                  {struck ? (
                    <>
                      <span style={{ fontSize: 13, color: C.muted, minWidth: 40, textAlign: 'center' }}>Strich</span>
                      <button onClick={() => setScore(p.id, courseFor(m.holes).pars[hole - 1])} style={{ ...smallBtn, padding: '5px 10px' }}>Zurück</button>
                    </>
                  ) : (
                    <>
                      <button onClick={() => setScore(p.id, Math.max(1, cur - 1))} style={smallCircleBtn}>−</button>
                      <span style={{ fontSize: 18, fontWeight: 600, minWidth: 20, textAlign: 'center' }}>{cur}</span>
                      <button onClick={() => setScore(p.id, cur + 1)} style={smallCircleBtn}>+</button>
                      <button onClick={() => { if (window.confirm(`${p.name}: Loch ${hole} wirklich als Strich (aufgegeben, 0 Punkte) eintragen?`)) setScore(p.id, STRICH); }} title="Loch aufgeben" style={{ ...smallBtn, padding: '5px 8px', fontSize: 11, color: C.muted, marginLeft: 4 }}>Strich</button>
                    </>
                  )}
                </div>
              </div>
            );
          })}
        </div>

        <div style={{ padding: '12px 18px', borderTop: `1px solid ${C.line}`, textAlign: 'center', fontSize: 11, color: C.muted }}>
          ✓ Automatisch gespeichert
        </div>
      </div>
    </div>
  );
}

const circleBtn = { width: 36, height: 36, borderRadius: '50%', border: `1px solid ${C.line}`, background: '#fff', fontSize: 18, cursor: 'pointer', color: C.ink };
const smallCircleBtn = { width: 30, height: 30, borderRadius: '50%', border: `1px solid ${C.line}`, background: '#fff', fontSize: 14, cursor: 'pointer', color: C.ink };

class ErrorBoundary extends React.Component {
  constructor(props) { super(props); this.state = { error: null }; }
  static getDerivedStateFromError(error) { return { error }; }
  componentDidCatch(error, info) { console.error('App-Fehler:', error, info); }
  render() {
    if (this.state.error) {
      return <div style={{ minHeight: '100vh', background: '#fff', color: '#900', fontFamily: 'monospace', padding: 20, whiteSpace: 'pre-wrap' }}>
        <h2>Es ist ein Fehler aufgetreten:</h2>{String(this.state.error && this.state.error.stack || this.state.error)}
      </div>;
    }
    return this.props.children;
  }
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<ErrorBoundary><App /></ErrorBoundary>);
</script>
